name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} 構文チェック
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: 構文チェック
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  phpcs:
    name: コーディング規約・PHP 互換性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer lint

  theme-json:
    name: theme.json の形式チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in theme.json styles/*.json; do jq empty "$f" && echo "OK $f"; done
